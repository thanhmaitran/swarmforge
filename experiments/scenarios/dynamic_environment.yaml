experiment:
  name: dynamic_environment
  description: Replanning behaviour under obstacle insertion/removal, robot failures and continuously arriving tasks.
  kind: simulation
  base_config: warehouse_small
  seeds: [42, 123, 456, 789, 1024, 2048, 4096, 8192, 16384, 32768]
  factors:
    scenario: [static, obstacle_insertion, temporary_blockage, new_tasks_during_run, robot_failures]
  variants:
    scenario:
      static: {}
      obstacle_insertion: {dynamics.random_obstacle_events: 8, dynamics.random_obstacle_duration: 1000000.0}
      temporary_blockage: {dynamics.random_obstacle_events: 8, dynamics.random_obstacle_duration: 25.0}
      new_tasks_during_run: {tasks.arrival: poisson, tasks.arrival_rate: 0.12}
      robot_failures: {dynamics.random_failures: 2, dynamics.random_failure_duration: 30.0}
  overrides:
    fleet.robot_count: 10
    tasks.count: 40
    simulation.max_simulation_time: 1200.0
  max_wall_seconds: 120
  metrics: [task_completion_rate, simulation_time, total_distance, replans, planning_runtime_ms, unfinished_tasks,
            average_completion_time, reassignments, collision_count]
  profiles:
    quick:
      seeds: [42, 123, 456, 789, 1024]
