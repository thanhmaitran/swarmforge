[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "swarmforge"
version = "0.1.0"
description = "Multi-Robot Coordination and Autonomous Fleet Simulation Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The core simulator has no web/ROS dependencies (ADR-0004); the API stack is opt-in.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "websockets>=13.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=4.0",
]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
swarmforge = "swarmforge.cli:main"

[tool.scikit-build]
wheel.packages = ["src/swarmforge"]
cmake.source-dir = "cpp"
cmake.version = ">=3.20"

[tool.scikit-build.cmake.define]
SWARMFORGE_BUILD_TESTS = "OFF"
SWARMFORGE_BUILD_BENCHMARKS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
pythonpath = ["src", "tests", "tests/regression", "apps/api/src"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/utilities/generate_gazebo_assets.py" = ["E501"]
"tests/**" = ["E731", "B018"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/swarmforge"]

[tool.coverage.run]
source = ["src/swarmforge"]
branch = true
